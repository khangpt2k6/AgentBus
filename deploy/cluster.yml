# 5-node EventBus cluster for local demos.
# Run from the repo root:
#   docker compose -f deploy/cluster.yml up --build
#
# After ~5s, each node's /api/stats shows real Raft state. Try:
#   goqueue cluster status --metrics-url=http://localhost:12112
#   goqueue cluster status --metrics-url=http://localhost:12113
#   goqueue cluster status --metrics-url=http://localhost:12114
#   goqueue cluster status --metrics-url=http://localhost:12115
#   goqueue cluster status --metrics-url=http://localhost:12116
#
# Exactly one of the five nodes should show Role: leader. A 5-node Raft
# group tolerates 2 node losses (majority = 3 of 5) instead of the 1-node
# tolerance a 3-node group gives you, and every shard is replicated to all
# five nodes (full-mesh ISR), so killing any 2 nodes still loses zero
# quorum-committed data.

services:
  n1:
    build:
      context: ..
      dockerfile: docker/broker.Dockerfile
    command:
      - --cluster
      - --node-id=n1
      - --raft-bind=n1:7001
      - --gossip-bind=n1:8001
      - --raft-dir=/data/raft
      - --peers=n1@n1:7001,n2@n2:7001,n3@n3:7001,n4@n4:7001,n5@n5:7001
      - --tcp-addr=:9090
      - --grpc-addr=:9095
      - --metrics-addr=:2112
      - --wal-path=/data/wal
      - --advertise-client-addr=n1:9095
    ports:
      - "19090:9090"
      - "19095:9095"
      - "12112:2112"
    volumes:
      - n1-data:/data
    networks:
      - eventbus

  n2:
