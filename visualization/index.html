<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EventBus — Architecture</title>
<meta name="description" content="A live architecture diagram of EventBus: a Raft-replicated, write-ahead-logged message broker for AI-agent event streams." />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

<style>
  :root {
    --bg-0: #ffffff;
    --bg-1: #f7f8fb;
    --grid: #eef1f5;

    --indigo: #4f46e5;
    --indigo-soft: #eef2ff;
    --emerald: #10b981;

    --line: #cbd5e1;
    --ink: #0f172a;
    --sub: #64748b;
    --muted: #94a3b8;

    --font-display: "Space Grotesk", sans-serif;
    --font-body: "Inter", sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, monospace;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    margin: 0;
    background:
      radial-gradient(1200px 800px at 50% -8%, #ffffff, transparent 70%),
      linear-gradient(180deg, var(--bg-0), var(--bg-1));
    color: var(--ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .bg-grid {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 42px 42px;
    mask-image: radial-gradient(ellipse 82% 80% at 50% 48%, #000 52%, transparent 100%);
    -webkit-mask-image: radial-gradient(ellipse 82% 80% at 50% 48%, #000 52%, transparent 100%);
    opacity: 0.55;
  }

  main {
    position: relative; z-index: 1;
    width: 100%;
    max-width: 1280px;
    padding: clamp(20px, 4vw, 56px);
  }

  .svg-scroll { width: 100%; overflow-x: auto; overflow-y: hidden; }
  .arch-svg { display: block; width: 100%; height: auto; min-width: 1000px; }

  /* mobile stacked fallback */
  .arch-mobile { display: none; }

  @media (max-width: 880px) {
    .svg-scroll { display: none; }
    .arch-mobile { display: block; }
  }

  .m-band {
    font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--muted); margin: 20px 0 11px;
    display: flex; align-items: center; gap: 10px;
  }
  .m-band:first-child { margin-top: 0; }
  .m-band::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .m-col { display: flex; flex-direction: column; gap: 10px; }
  .m-node {
    border: 1px solid #e5e7eb; border-radius: 13px; background: #fff;
    padding: 13px 14px; display: flex; gap: 12px; align-items: center;
    box-shadow: 0 1px 2px rgba(15,23,42,0.04), 0 6px 16px rgba(15,23,42,0.06);
  }
  .m-node.core { border-color: #c7d2fe; }
  .m-node.commit { border-color: #6ee7b7; }
  .m-ic {
    width: 38px; height: 38px; flex: none; border-radius: 10px;
    display: grid; place-items: center; background: var(--indigo-soft); color: var(--indigo);
  }
  .m-node.commit .m-ic { background: #d1fae5; color: #047857; }
  .m-ic svg { width: 20px; height: 20px; }
  .m-node .ti { font-family: var(--font-display); font-weight: 600; font-size: 14px; color: var(--ink); }
  .m-node .su { font-family: var(--font-mono); font-size: 10.5px; color: var(--sub); margin-top: 2px; line-height: 1.4; }
  .m-arrow { text-align: center; color: var(--muted); font-size: 13px; font-family: var(--font-mono); }
  .m-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .m-chip {
    font-family: var(--font-mono); font-size: 11px; color: var(--ink);
    border: 1px solid #e5e7eb; border-radius: 8px; padding: 8px 10px; background: #f8fafc;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .m-chip svg { width: 14px; height: 14px; color: var(--sub); }
  .m-chip.lead { border-color: #c7d2fe; color: var(--indigo); background: var(--indigo-soft); }
  .m-chip.lead svg { color: var(--indigo); }

  /* continuous animation primitives */
  @keyframes commitPulse {
    0%, 64%, 100% { stroke: #e2e8f0; }
    70%, 88% { stroke: var(--emerald); }
  }
  @keyframes commitGlow {
    0%, 60%, 100% { opacity: 0; }
    72%, 84% { opacity: 1; }
  }
  @keyframes ackFlash {
    0%, 55%, 100% { stroke: #e2e8f0; }
    62%, 86% { stroke: var(--emerald); }
  }
  @keyframes ackLbl {
    0%, 52%, 100% { opacity: 0; }
    64%, 92% { opacity: 1; }
  }
  @keyframes newCell {
    0%, 50%, 100% { fill: #f1f5f9; stroke: #e2e8f0; }
    64%, 95% { fill: #d1fae5; stroke: #6ee7b7; }
  }
  @keyframes quorumRing {
    0%, 45% { transform: scale(0.72); opacity: 0; }
    60% { transform: scale(1); opacity: 0.9; }
    85%, 100% { transform: scale(1.18); opacity: 0; }
  }
  @keyframes quorumMark {
    0%, 45%, 100% { stroke: #94a3b8; }
    60%, 90% { stroke: var(--emerald); }
  }
  @keyframes leaderHalo {
    0%, 100% { opacity: 0.35; }
    50% { opacity: 0.85; }
  }
  @keyframes livePulse {
    0% { box-shadow: 0 0 0 0 rgba(16,185,129,0.4); }
    70% { box-shadow: 0 0 0 6px rgba(16,185,129,0); }
    100% { box-shadow: 0 0 0 0 rgba(16,185,129,0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .packet { display: none !important; }
    .commit-card, .commit-glow, .f-card, .ack-lbl, .newcell, .q-ring, .q-check, .leader-halo { animation: none !important; }
  }
</style>
</head>
<body>

<div class="bg-grid" aria-hidden="true"></div>

<main>
  <!-- ============ DESKTOP SVG (continuous) ============ -->
  <div class="svg-scroll">
    <svg class="arch-svg" id="svg" viewBox="0 0 1160 720" role="img"
      aria-label="Live architecture diagram of EventBus. AI agents (planner, researcher, executor) stream events over gRPC and TCP into the Event Bus Core: a session router feeds partitioned topics, which append to a durable write-ahead log and branch to a retry and dead-letter queue, then forward to consumer groups and webhook fan-out, with an observability tap. Below, a Raft consensus cluster continuously replicates the leader's log to two followers, reaching quorum three of three. Indigo packets flow along every connector; the write-ahead log and Raft replication pulse emerald.">
      <defs>
        <radialGradient id="pk" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#c7d2fe"/>
          <stop offset="45%" stop-color="#6366f1"/>
          <stop offset="100%" stop-color="#4f46e5"/>
        </radialGradient>
        <radialGradient id="pkg" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#a7f3d0"/>
          <stop offset="45%" stop-color="#34d399"/>
          <stop offset="100%" stop-color="#10b981"/>
        </radialGradient>
        <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
          <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08"/>
        </filter>
        <filter id="pkGlow" x="-120%" y="-120%" width="340%" height="340%">
          <feGaussianBlur stdDeviation="2.4" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <style>
          .ntitle { font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:13.5px; fill:#0f172a; }
          .nsub { font-family:'JetBrains Mono',monospace; font-size:9.5px; fill:#94a3b8; }
          .nrole { font-family:'JetBrains Mono',monospace; font-size:10px; fill:#64748b; }
          .reg-lbl { font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:0.14em; fill:#b0b7c3; }
          .elabel { font-family:'JetBrains Mono',monospace; font-size:9px; fill:#b0b7c3; }
          .ic { stroke-width:1.7; fill:none; stroke-linecap:round; stroke-linejoin:round; }
        </style>
      </defs>
      <g id="regions"></g>
      <g id="edges"></g>
      <g id="nodes"></g>
      <g id="packets"></g>
    </svg>
  </div>

  <!-- ============ MOBILE STACKED ============ -->
  <div class="arch-mobile" id="mobile"></div>
</main>

<script>
(function () {
  "use strict";
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var SVGNS = "http://www.w3.org/2000/svg";

  // ============================================================
  // NODE MODEL — known geometry; edges DERIVED from it.
  // ============================================================
  var N = {
    planner:    { x:46,  y:78,  w:172, h:56, title:"Agent", role:"planner",    icon:"bot" },
    researcher: { x:46,  y:152, w:172, h:56, title:"Agent", role:"researcher", icon:"bot" },
    executor:   { x:46,  y:226, w:172, h:56, title:"Agent", role:"executor",   icon:"bot" },
    router:     { x:300, y:150, w:178, h:60, title:"Session Router", sub:"per-agent affinity", icon:"route", core:true },
    topics:     { x:520, y:148, w:206, h:64, title:"Partitioned Topics", sub:"consistent-hash · ordered", icon:"layers", core:true },
    wal:        { x:360, y:286, w:196, h:64, title:"Write-Ahead Log", sub:"group-commit fsync", icon:"disk", core:true, commit:true },
    retry:      { x:600, y:286, w:196, h:64, title:"Retry & DLQ", sub:"backoff · dead-letter", icon:"retry", core:true },
    observ:     { x:910, y:36,  w:200, h:58, title:"Observability", sub:"Prometheus · OTel · Grafana", icon:"activity" },
    consumers:  { x:910, y:150, w:200, h:64, title:"Consumers", sub:"groups · lag tracking", icon:"users" },
    webhook:    { x:910, y:250, w:200, h:60, title:"Webhook Fan-out", sub:"at-least-once delivery", icon:"webhook" },
    leader:     { x:120, y:486, w:250, h:170, title:"Raft Leader", sub:"term 7 · node-a", icon:"server", leader:true, log:5 },
    follower1:  { x:650, y:470, w:250, h:96,  title:"Follower", sub:"node-b", icon:"server", log:4 },
    follower2:  { x:650, y:600, w:250, h:96,  title:"Follower", sub:"node-c", icon:"server", log:4 },
    quorum:     { x:946, y:520, w:150, h:120, quorum:true }
  };

  var REGIONS = [
    { x:278, y:118, w:472, h:254, label:"EVENT BUS CORE" },
    { x:46,  y:438, w:1068, h:254, label:"RAFT CONSENSUS CLUSTER" }
  ];

  // edges: endpoint node + border side; path COMPUTED (orthogonal)
  var EDGES = [
    { id:"e_planner",    from:"planner",    fromSide:"R", to:"router", toSide:"L", railX:272 },
    { id:"e_researcher", from:"researcher", fromSide:"R", to:"router", toSide:"L", railX:272 },
    { id:"e_executor",   from:"executor",   fromSide:"R", to:"router", toSide:"L", railX:272 },
    { id:"e_rt",  from:"router", fromSide:"R", to:"topics", toSide:"L" },
    { id:"e_tw",  from:"topics", fromSide:"B", to:"wal", toSide:"T", midY:268 },
    { id:"e_tr",  from:"topics", fromSide:"B", to:"retry", toSide:"T", midY:268 },
    { id:"e_tc",  from:"topics", fromSide:"R", to:"consumers", toSide:"L", railX:824 },
    { id:"e_cw",  from:"consumers", fromSide:"B", to:"webhook", toSide:"T" },
    { id:"e_to",  from:"topics", fromSide:"T", to:"observ", toSide:"L", railX:824 },
    { id:"e_wl",  from:"wal", fromSide:"B", to:"leader", toSide:"T", midY:418 },
    { id:"e_lf1", from:"leader", fromSide:"R", to:"follower1", toSide:"L", railX:510, raft:true },
    { id:"e_lf2", from:"leader", fromSide:"R", to:"follower2", toSide:"L", railX:510, raft:true }
  ];

  // packet schedule: each connector gets continuous, staggered packets
  // {edge, count, dur, kind}
  var FLOWS = [
    { edge:"e_planner",    count:2, dur:2.6, kind:"flow" },
    { edge:"e_researcher", count:2, dur:2.4, kind:"flow" },
    { edge:"e_executor",   count:2, dur:2.8, kind:"flow" },
    { edge:"e_rt",  count:2, dur:2.0, kind:"flow" },
    { edge:"e_tc",  count:2, dur:2.8, kind:"flow" },
    { edge:"e_cw",  count:1, dur:2.0, kind:"flow" },
    { edge:"e_tw",  count:1, dur:2.6, kind:"flow" },
    { edge:"e_tr",  count:1, dur:3.0, kind:"flow" },
    { edge:"e_to",  count:1, dur:3.2, kind:"flow" },
    { edge:"e_wl",  count:1, dur:2.8, kind:"flow" },
    { edge:"e_lf1", count:1, dur:2.0, kind:"raft" },
    { edge:"e_lf2", count:1, dur:2.0, kind:"raft" }
  ];

  var ICONS = {
    bot:    "M9 0 v3 M3 3 h12 a2 2 0 0 1 2 2 v8 a2 2 0 0 1 -2 2 H3 a2 2 0 0 1 -2 -2 V5 a2 2 0 0 1 2 -2 M6 9 h0.01 M12 9 h0.01 M7 13 h4",
    route:  "M3 2 a2 2 0 1 0 0.01 0 M3 4 v7 a2 2 0 0 0 2 2 h7 M15 13 a2 2 0 1 0 0.01 0 M15 2 a2 2 0 1 0 0.01 0 M15 4 v4 a2 2 0 0 1 -2 2 H7",
    layers: "M9 0 l9 4.5 -9 4.5 -9 -4.5 z M0 9 l9 4.5 9 -4.5 M0 13.5 l9 4.5 9 -4.5",
    disk:   "M2 0 h11 l4 4 v11 a2 2 0 0 1 -2 2 H2 a2 2 0 0 1 -2 -2 V2 a2 2 0 0 1 2 -2 M4 0 v5 h7 V0 M4 18 v-6 h9 v6",
    retry:  "M17 8 a8 8 0 1 1 -2.3 -5.6 M17 1.5 v4.5 h-4.5",
    activity:"M0 9 h3.5 l2.5 -7 4.5 14 2.5 -7 h5",
    users:  "M6.5 8 a3.2 3.2 0 1 0 0 -6.4 3.2 3.2 0 0 0 0 6.4 M1 18 a5.5 5.5 0 0 1 11 0 M14 8.2 a2.6 2.6 0 1 0 0 -5.2 M12 18 a4.4 4.4 0 0 1 5.5 -4.2",
    webhook:"M5.5 6.5 a3.3 3.3 0 1 1 4.4 2.9 l-2.2 3.8 M10 15 a3.3 3.3 0 1 1 -5 -2.9 M12 10.4 a3.3 3.3 0 1 1 -1.7 5.5",
    server: "M0 1 h16 a1 1 0 0 1 1 1 v3.5 a1 1 0 0 1 -1 1 H1 a1 1 0 0 1 -1 -1 V2 a1 1 0 0 1 1 -1 M0 9.5 h16 a1 1 0 0 1 1 1 V14 a1 1 0 0 1 -1 1 H1 a1 1 0 0 1 -1 -1 v-3.5 a1 1 0 0 1 1 -1 M4 4 h0.01 M4 12 h0.01"
  };

  function el(tag, attrs) {
    var e = document.createElementNS(SVGNS, tag);
    if (attrs) for (var k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }
  function anchor(n, side) {
    switch (side) {
      case "L": return [n.x, n.y + n.h/2];
      case "R": return [n.x + n.w, n.y + n.h/2];
      case "T": return [n.x + n.w/2, n.y];
      case "B": return [n.x + n.w/2, n.y + n.h];
    }
  }
  function buildPath(edge) {
    var a = N[edge.from], b = N[edge.to];
    var p0 = anchor(a, edge.fromSide), p1 = anchor(b, edge.toSide);
    var x0=p0[0], y0=p0[1], x1=p1[0], y1=p1[1], d;
    if (edge.railX != null) {
      d = "M "+x0+" "+y0+" H "+edge.railX+" V "+y1+" H "+x1;
    } else if (edge.midY != null) {
      d = "M "+x0+" "+y0+" V "+edge.midY+" H "+x1+" V "+y1;
    } else if (edge.fromSide==="R" && edge.toSide==="L") {
      if (Math.abs(y0-y1)<0.5) d = "M "+x0+" "+y0+" H "+x1;
      else { var mx=(x0+x1)/2; d = "M "+x0+" "+y0+" H "+mx+" V "+y1+" H "+x1; }
    } else if (edge.fromSide==="B" && edge.toSide==="T") {
      if (Math.abs(x0-x1)<0.5) d = "M "+x0+" "+y0+" V "+y1;
      else { var my=(y0+y1)/2; d = "M "+x0+" "+y0+" V "+my+" H "+x1+" V "+y1; }
    } else {
      d = "M "+x0+" "+y0+" L "+x1+" "+y1;
    }
    return d;
  }

  var gRegions = document.getElementById("regions");
  var gEdges   = document.getElementById("edges");
  var gNodes   = document.getElementById("nodes");
  var gPackets = document.getElementById("packets");

  // regions
  REGIONS.forEach(function (r) {
    var rect = el("rect", { x:r.x, y:r.y, width:r.w, height:r.h, rx:18, fill:"#fcfcfd", stroke:"#e8ebf0", "stroke-width":1.2 });
    gRegions.appendChild(rect);
    var t = el("text", { x:r.x+18, y:r.y+22, "class":"reg-lbl" }); t.textContent = r.label; gRegions.appendChild(t);
  });

  // edges (visible at rest; brighten handled by an overlay tween per packet)
  var edgePaths = {};
  EDGES.forEach(function (e) {
    var d = buildPath(e);
    var base = el("path", { d:d, fill:"none", stroke:"#cbd5e1", "stroke-width":1.6, id:e.id });
    var glow = el("path", { d:d, fill:"none", stroke: e.raft ? "#34d399" : "#818cf8", "stroke-width":2.4, opacity:0.0 });
    glow.setAttribute("class","edge-glow"); glow.dataset.edge = e.id;
    gEdges.appendChild(base); gEdges.appendChild(glow);
    edgePaths[e.id] = { base:base, glow:glow, d:d };
  });

  // nodes
  var nodeEls = {};
  function drawNode(id) {
    var n = N[id];
    var g = el("g", {}); g.dataset.id = id;

    if (n.quorum) {
      var qcx = n.x+n.w/2, qcy = n.y+44;
      var halo = el("circle", { cx:qcx, cy:qcy, r:21, fill:"none", stroke:"#10b981", "stroke-width":2, opacity:0 });
      halo.setAttribute("class","q-ring");
      g.appendChild(halo);
      var ring = el("circle", { cx:qcx, cy:qcy, r:21, fill:"#f8fafc", stroke:"#e2e8f0", "stroke-width":1.3 });
      g.appendChild(ring);
      var chk = el("path", { d:"M "+(qcx-9)+" "+qcy+" l 6 6 12 -13", fill:"none", stroke:"#94a3b8", "stroke-width":2.6, "stroke-linecap":"round", "stroke-linejoin":"round" });
      chk.setAttribute("class","q-check"); g.appendChild(chk);
      var qt1 = el("text", { x:qcx, y:n.y+86, "class":"nrole", "text-anchor":"middle" }); qt1.textContent="quorum 3/3"; g.appendChild(qt1);
      var qt2 = el("text", { x:qcx, y:n.y+100, "class":"nsub", "text-anchor":"middle", fill:"#059669" }); qt2.textContent="committed"; g.appendChild(qt2);
      gNodes.appendChild(g); nodeEls[id]=g; return;
    }

    // leader gets a soft pulsing halo
    if (n.leader) {
      var lh = el("rect", { x:n.x-3, y:n.y-3, width:n.w+6, height:n.h+6, rx:15, fill:"none", stroke:"#c7d2fe", "stroke-width":2 });
      lh.setAttribute("class","leader-halo"); g.appendChild(lh);
    }

    var stroke = n.commit ? "#6ee7b7" : (n.core || n.leader ? "#c7d2fe" : "#e2e8f0");
    var card = el("rect", { x:n.x, y:n.y, width:n.w, height:n.h, rx:12, fill:"#ffffff", stroke:stroke, "stroke-width":1.3, filter:"url(#soft)" });
    if (n.commit) card.setAttribute("class","commit-card");
    if (id==="follower1" || id==="follower2") card.setAttribute("class","f-card");
    g.appendChild(card);

    // commit glow overlay (WAL only)
    if (n.commit) {
      var cg = el("rect", { x:n.x, y:n.y, width:n.w, height:n.h, rx:12, fill:"none", stroke:"#10b981", "stroke-width":2.4, opacity:0 });
      cg.setAttribute("class","commit-glow"); g.appendChild(cg);
    }

    // icon chip
    var chipBg = n.commit ? "#d1fae5" : (n.leader ? "#eef2ff" : (n.core ? "#eef2ff" : "#f1f5f9"));
    var icStroke = n.commit ? "#047857" : (n.core || n.leader ? "#4f46e5" : "#64748b");
    var chipX = n.x + 16, chipY = n.y + (n.log ? 16 : n.h/2 - 16);
    var chip = el("rect", { x:chipX, y:chipY, width:32, height:32, rx:8, fill:chipBg });
    g.appendChild(chip);
    var ig = el("g", { transform:"translate("+(chipX+7)+","+(chipY+7)+")" });
    var ip = el("path", { d:ICONS[n.icon]||"", "stroke":icStroke }); ip.setAttribute("class","ic");
    ig.appendChild(ip); g.appendChild(ig);

    var tx = chipX + 44;
    if (n.role) {
      var t1 = el("text", { x:tx, y:n.y+n.h/2-2, "class":"ntitle" }); t1.textContent = n.title;
      var t2 = el("text", { x:tx, y:n.y+n.h/2+14, "class":"nrole" }); t2.textContent = "· "+n.role;
      g.appendChild(t1); g.appendChild(t2);
    } else {
      var ty = n.log ? n.y+30 : n.y+n.h/2-3;
      var s1 = el("text", { x:tx, y:ty, "class":"ntitle" }); s1.textContent = n.title; g.appendChild(s1);
      if (n.sub) {
        var s2 = el("text", { x:tx, y:ty+15, "class":"nsub", fill: n.commit ? "#059669" : "#94a3b8" }); s2.textContent = n.sub; g.appendChild(s2);
      }
    }

    // raft replicated log
    if (n.log) {
      var total = 5, filled = n.log;
      var lx = n.x + 16, ly = n.y + n.h - 30, cellW = 38, gap = 6;
      var lab = el("text", { x:lx, y:ly-8, "class":"nsub" }); lab.textContent = "replicated log"; g.appendChild(lab);
      for (var i=0;i<total;i++){
        var on = i < filled;
        var isNew = (id!=="leader" && i===4);
        var c = el("rect", { x:lx+i*(cellW+gap), y:ly, width:cellW, height:20, rx:4,
          fill: on ? (id==="leader" ? "#e0e7ff" : "#eef2f6") : "#f1f5f9",
          stroke: on ? (id==="leader" ? "#c7d2fe" : "#e2e8f0") : "#e2e8f0", "stroke-width":1 });
        if (isNew) c.setAttribute("class","newcell");
        g.appendChild(c);
      }
      if (id!=="leader") {
        var ack = el("text", { x:n.x+n.w-16, y:n.y+24, "class":"nsub", "text-anchor":"end", fill:"#059669", opacity:0 });
        ack.setAttribute("class","ack-lbl"); ack.textContent="ack ✓"; g.appendChild(ack);
      }
    }

    gNodes.appendChild(g); nodeEls[id] = g;
  }
  Object.keys(N).forEach(drawNode);

  // decorative labels
  function deco(x,y,cls,txt,extra){ var a={x:x,y:y,"class":cls}; if(extra) for(var k in extra) a[k]=extra[k]; var t=el("text",a); t.textContent=txt; gNodes.appendChild(t); }
  // edge label with a white halo so connector lines never strike through the text
  function edgeLabel(cx,cy,txt){
    var halfW = txt.length * 2.7 + 6;
    var halo = el("rect",{ x:cx-halfW, y:cy-9, width:halfW*2, height:13, rx:3, fill:"#ffffff", opacity:0.92 });
    gNodes.appendChild(halo);
    deco(cx,cy,"elabel",txt,{ "text-anchor":"middle" });
  }
  edgeLabel(267,95,"gRPC · TCP · CLI");
  deco(46,66,"reg-lbl","AGENTS");
  edgeLabel(560,462,"replicated via Raft · acks = quorum");

  // ============================================================
  // CONTINUOUS PACKETS — animateMotion on every connector, staggered
  // ============================================================
  if (!reduce) {
    FLOWS.forEach(function (f) {
      for (var k=0; k<f.count; k++) {
        var c = el("circle", { r: f.kind==="raft" ? 4 : 4.2, fill: f.kind==="raft" ? "url(#pkg)" : "url(#pk)", filter:"url(#pkGlow)" });
        c.setAttribute("class","packet");
        var begin = ((f.dur / f.count) * k + Math.random()*0.4).toFixed(2);
        var am = el("animateMotion", { dur: f.dur+"s", begin: begin+"s", repeatCount:"indefinite", rotate:"0" });
        var mp = el("mpath"); mp.setAttribute("href","#"+f.edge);
        mp.setAttributeNS("http://www.w3.org/1999/xlink","href","#"+f.edge);
        am.appendChild(mp); c.appendChild(am); gPackets.appendChild(c);
      }
    });

    // edge brighten: gently oscillate the glow opacity so lines "breathe" as flow passes
    EDGES.forEach(function (e, i) {
      var ep = edgePaths[e.id];
      var an = el("animate", { attributeName:"opacity", values:"0.05;0.45;0.05", dur:"2.6s",
        begin:(i*0.18).toFixed(2)+"s", repeatCount:"indefinite" });
      ep.glow.appendChild(an);
    });
  } else {
    // reduced motion: show a quiet static "committed" end-state
    var f1 = nodeEls.follower1, f2 = nodeEls.follower2, q = nodeEls.quorum;
    [f1,f2].forEach(function(g){ if(!g) return;
      var nc = g.querySelector(".newcell"); if (nc){ nc.setAttribute("fill","#d1fae5"); nc.setAttribute("stroke","#6ee7b7"); }
      var ack = g.querySelector(".ack-lbl"); if (ack) ack.setAttribute("opacity","1");
    });
    if (q){ q.querySelector(".q-check").setAttribute("stroke","#059669"); }
    var wal = nodeEls.wal; if (wal){ var cg=wal.querySelector(".commit-glow"); }
  }

  // attach the recurring pulse animations (CSS keyframes via class + inline timing)
  if (!reduce) {
    var wal = nodeEls.wal;
    if (wal) {
      wal.querySelector(".commit-card").style.animation = "commitPulse 4.2s ease-in-out infinite";
      wal.querySelector(".commit-glow").style.animation = "commitGlow 4.2s ease-in-out infinite";
    }
    ["follower1","follower2"].forEach(function(id, idx){
      var g = nodeEls[id]; if(!g) return;
      var delay = (idx*0.5).toFixed(2)+"s";
      var fc = g.querySelector(".f-card");
      var nc = g.querySelector(".newcell");
      var ack = g.querySelector(".ack-lbl");
      if (fc) fc.style.animation = "ackFlash 4s ease-in-out infinite "+delay;
      if (nc) nc.style.animation = "newCell 4s ease-in-out infinite "+delay;
      if (ack) ack.style.animation = "ackLbl 4s ease-in-out infinite "+delay;
    });
    var q = nodeEls.quorum;
    if (q) {
      q.querySelector(".q-ring").style.animation = "quorumRing 4s ease-out infinite 0.6s";
      q.querySelector(".q-ring").style.transformBox = "fill-box";
      q.querySelector(".q-ring").style.transformOrigin = "center";
      q.querySelector(".q-check").style.animation = "quorumMark 4s ease-in-out infinite 0.6s";
    }
    var lh = nodeEls.leader.querySelector(".leader-halo");
    if (lh) lh.style.animation = "leaderHalo 3s ease-in-out infinite";
  }

  // ============================================================
  // MOBILE stacked (static, full color)
  // ============================================================
  var mobileEl = document.getElementById("mobile");
  function mIco(icon){ return '<svg viewBox="0 0 18 18" fill="none" stroke="currentColor" class="ic"><path d="'+(ICONS[icon]||"")+'"/></svg>'; }
  function mNode(id, cls){
    var n=N[id];
    var label = n.role ? (n.title+" · "+n.role) : n.title;
    var sub = n.sub || "";
    return '<div class="m-node '+(cls||"")+'"><div class="m-ic">'+mIco(n.icon)+'</div>'
      + '<div><div class="ti">'+label+'</div><div class="su">'+sub+'</div></div></div>';
  }
  var mHtml = "";
  mHtml += '<div class="m-band">◇ Agents (producers)</div><div class="m-col">'
        + mNode("planner") + mNode("researcher") + mNode("executor") + '</div>';
  mHtml += '<div class="m-arrow">↓ fan-in · gRPC · TCP · CLI</div>';
  mHtml += '<div class="m-band">Event Bus Core</div><div class="m-col">'
        + mNode("router","core") + mNode("topics","core") + mNode("wal","commit") + mNode("retry","core") + '</div>';
  mHtml += '<div class="m-arrow">↓</div>';
  mHtml += '<div class="m-band">Delivery</div><div class="m-col">'
        + mNode("consumers") + mNode("webhook") + mNode("observ") + '</div>';
  mHtml += '<div class="m-band">⬡ Raft consensus cluster</div><div class="m-col">'
        + '<div class="m-node core"><div class="m-ic">'+mIco("server")+'</div><div><div class="ti">Raft Leader · node-a</div><div class="su">term 7 · log offsets 0–4 committed</div></div></div>'
        + '<div class="m-arrow" style="margin:2px 0">↓ replicate</div>'
        + '<div class="m-node"><div class="m-ic">'+mIco("server")+'</div><div><div class="ti">Follower · node-b</div><div class="su" style="color:#059669">in sync · ack ✓</div></div></div>'
        + '<div class="m-node"><div class="m-ic">'+mIco("server")+'</div><div><div class="ti">Follower · node-c</div><div class="su" style="color:#059669">in sync · ack ✓</div></div></div>'
        + '<div class="m-node commit"><div class="m-ic"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" class="ic"><path d="M2 9 l5 5 9 -11"/></svg></div><div><div class="ti">Quorum 3/3 committed</div><div class="su" style="color:#059669">zero-data-loss failover</div></div></div>'
        + '</div>';
  mobileEl.innerHTML = mHtml;
})();
</script>

</body>
</html>
