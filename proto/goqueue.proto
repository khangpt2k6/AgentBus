syntax = "proto3";

package goqueue.v1;

option go_package = "github.com/khangpt2k6/AgentBus/proto;goqueuev1";

service BrokerService {
  rpc Publish(PublishRequest) returns (PublishResponse);
  rpc Consume(ConsumeRequest) returns (stream ConsumeMessage);
  // Fetch returns historical messages starting at from_offset. Unlike Consume,
  // it does not track consumer-group state and does not stream - it returns a
  // single page. Use it for session replay, debugging, and time-travel reads.
  rpc Fetch(FetchRequest) returns (FetchResponse);
  // PublishAgent publishes a structured agent event. In cluster mode, returns
  // FailedPrecondition with a NotLeaderError detail when this node does not
  // own the target shard - the client must redirect to the indicated leader.
  rpc PublishAgent(PublishAgentRequest) returns (PublishAgentResponse);
}

message PublishRequest {
  string topic = 1;
  bytes payload = 2;
  string key = 3;
  int32 partition = 4;
}

message PublishResponse {
  int64 offset = 1;
  int32 partition = 2;
}

message ConsumeRequest {
  string topic = 1;
  string group = 2;
  int32 partition = 3;
}

message ConsumeMessage {
  int64 offset = 1;
  bytes payload = 2;
  int64 timestamp_unix_nano = 3;
  int32 partition = 4;
}

message FetchRequest {
  string topic = 1;
  int32 partition = 2;
  int64 from_offset = 3;
  // Maximum messages to return. Server caps at 4096.
  int32 max_count = 4;
  // Optional server-side filter. When set, the broker decodes each
  // candidate message as an agent envelope and returns only matches.
  // Reduces wire bytes drastically for session replay on busy topics.
  // Note: filtering decodes JSON server-side, so it costs CPU per
  // scanned message; broker may scan up to scan_limit messages to
  // produce one page of matches.
  SessionFilter session_filter = 5;
  // Hard upper bound on messages the broker will scan to fill the
  // requested max_count. Default 16384, max 65536. Has no effect when
  // session_filter is absent.
  int32 scan_limit = 6;
}

// SessionFilter selects events whose envelope matches the given triple.
// All non-empty fields must match (logical AND). Empty fields are wildcards.
message SessionFilter {
  string tenant = 1;
  string project = 2;
  string session_id = 3;
}

message FetchResponse {
  repeated ConsumeMessage messages = 1;
  // next_offset is the offset to pass on the next page to continue reading.
  // Equals from_offset + len(messages) on success.
  int64 next_offset = 2;
  // head is the oldest offset still retained for this partition (older
  // messages have been evicted from the ring buffer).
  int64 head = 3;
  // tail is the next-write offset (one past the latest persisted message).
  int64 tail = 4;
}

// AgentEvent is a structured agent event envelope for the PublishAgent RPC.
message AgentEvent {
  string tenant     = 1;
  string project    = 2;
  string session_id = 3;
  string agent_id   = 4;
  string type       = 5;
  bytes  payload    = 6;
}

message PublishAgentRequest {
  AgentEvent event = 1;
}

message PublishAgentResponse {
  int64 offset    = 1;
  int32 partition = 2;
}

// NotLeaderError is returned as a status detail (alongside
// FailedPrecondition) when a client publishes to a node that does not
// own the target shard.
message NotLeaderError {
  // gRPC address (host:port) of the current leader. May be empty if the
  // leader is unknown or unreachable - the SDK should back off and retry.
  string leader_addr = 1;
}

// ---- Cluster (inter-node) RPCs -------------------------------------------
//
// Used by AgentBus broker nodes to replicate per-shard logs to each other.
// Not intended for client use; clients talk to BrokerService.

service ClusterService {
  // Replicate is a long-lived bidirectional stream from a shard leader to
  // a follower. The leader sends AppendEntry; the follower acks with the
  // last offset it has durably written.
  rpc Replicate(stream AppendEntry) returns (stream AppendAck);

  // CatchUp is a one-shot server-streaming RPC used by a follower to
  // backfill entries it is missing before joining the live Replicate
  // stream.
  rpc CatchUp(CatchUpRequest) returns (stream AppendEntry);
}

message AppendEntry {
  uint32 shard_id = 1;
  uint64 offset   = 2;
  bytes  payload  = 3;
  string leader_node_id = 4;
}

message AppendAck {
  uint32 shard_id    = 1;
  uint64 last_offset = 2;
  string node_id     = 3;
}

message CatchUpRequest {
  uint32 shard_id    = 1;
  uint64 from_offset = 2;
}

// ---- Control plane (agent orchestration) ---------------------------------
//
// Tracks registered agents and per-session run-state, and routes handoff
// events to the target agent's inbox. State is in-memory, rebuilt from the
// agent-events log; this service is the agent-facing control plane over the bus.

service ControlPlane {
  rpc RegisterAgent(RegisterAgentRequest) returns (RegisterAgentResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  // OpenInbox streams events routed to this agent (currently handoffs). The
  // stream stays open until the client disconnects.
  rpc OpenInbox(OpenInboxRequest) returns (stream RoutedEventMsg);
  rpc GetSessionState(SessionStateRequest) returns (RunStateMsg);
  rpc ListAgents(ListAgentsRequest) returns (AgentListResponse);
}

message RegisterAgentRequest {
  string agent_id = 1;
  repeated string capabilities = 2;
}

message RegisterAgentResponse {}

message HeartbeatRequest {
  string agent_id = 1;
}

message HeartbeatResponse {
  // known is false if the agent was never registered.
  bool known = 1;
}

message OpenInboxRequest {
  string agent_id = 1;
}

// RoutedEventMsg is an event the control plane delivered to an agent's inbox.
message RoutedEventMsg {
  string session_key = 1;
  string type        = 2;
  bytes  payload     = 3;
}

message SessionStateRequest {
  string tenant     = 1;
  string project    = 2;
  string session_id = 3;
}

// RunStateMsg is the control plane's view of one session's progress.
message RunStateMsg {
  string session_key          = 1;
  string active_agent         = 2;
  string pending_agent        = 3;
  int32  step_count           = 4;
  string status               = 5; // running | waiting | failed | completed
  int64  last_event_unix_nano = 6;
  // found is false if the session is unknown.
  bool   found                = 7;
}

message ListAgentsRequest {}

message AgentMsg {
  string id                  = 1;
  string status              = 2; // idle | busy | offline
  repeated string capabilities = 3;
  string current_session     = 4;
  int64  last_seen_unix_nano = 5;
}

message AgentListResponse {
  repeated AgentMsg agents = 1;
}

// ---- Workflow execution runtime -------------------------------------------
//
// A durable task-execution layer on top of the event log. Every state
// transition of an execution (submitted, leased, heartbeat, completed,
// failed, retry, dead) is an event appended through the same durable
// publish path as agent events: main WAL in single-node mode, shard WAL
// plus quorum replication in cluster mode. Execution state is a pure fold
// over those events, so it can be rebuilt deterministically from the log
// after a crash, a restart, or a leader failover.

service WorkflowService {
  // SubmitWorkflow durably enqueues a new workflow execution. Submitting an
  // id that already exists is an idempotent no-op (already_exists = true).
  // In cluster mode, returns FailedPrecondition with a NotLeaderError detail
  // when this node does not own the execution's shard.
  rpc SubmitWorkflow(SubmitWorkflowRequest) returns (SubmitWorkflowResponse);

  // LeaseTask hands the oldest pending execution of the given task type to a
  // worker. The lease is recorded on the log before the worker sees it. When
  // no work is pending the call long-polls up to wait_ms, then returns
  // found = false.
  rpc LeaseTask(LeaseTaskRequest) returns (LeaseTaskResponse);

  // HeartbeatTask extends a running lease. valid = false tells the worker its
  // lease is gone (expired or superseded) and it should abandon the attempt.
  rpc HeartbeatTask(HeartbeatTaskRequest) returns (HeartbeatTaskResponse);

  // CompleteTask records a successful result exactly once. A completion for
  // a stale attempt or an already-terminal execution is rejected with
  // accepted = false (and duplicate = true when the execution already
  // completed), so a zombie worker whose lease expired cannot double-commit.
  rpc CompleteTask(CompleteTaskRequest) returns (CompleteTaskResponse);

  // FailTask records a failed attempt. Retryable failures re-enqueue the
  // execution until max_attempts is exhausted; the response says whether a
  // retry was scheduled.
  rpc FailTask(FailTaskRequest) returns (FailTaskResponse);

  // GetExecution returns the current state of one execution.
  rpc GetExecution(GetExecutionRequest) returns (ExecutionStateMsg);

  // GetExecutionHistory returns the ordered state transitions of one
  // execution as rebuilt from the event log - the deterministic replay
  // surface used for debugging.
  rpc GetExecutionHistory(GetExecutionRequest) returns (ExecutionHistoryResponse);

  // ListExecutions returns execution summaries, optionally filtered by
  // status, plus in-flight counts.
  rpc ListExecutions(ListExecutionsRequest) returns (ListExecutionsResponse);
}

message SubmitWorkflowRequest {
  string tenant      = 1;
  string project     = 2;
  // Unique id of this execution within (tenant, project). Doubles as the
  // session id on the log, so executions shard exactly like sessions.
  string workflow_id = 3;
  // Task type names the worker queue that will execute this workflow.
  string task_type   = 4;
  bytes  input       = 5;
  // Maximum lease attempts before the execution is declared dead. 0 means
  // the server default (3).
  int32  max_attempts = 6;
  // Lease duration in milliseconds. A worker must complete, fail, or
  // heartbeat within this window or the coordinator re-enqueues the
  // execution. 0 means the server default (30000).
  int64  lease_ttl_ms = 7;
}

message SubmitWorkflowResponse {
  bool already_exists = 1;
}

message LeaseTaskRequest {
  string task_type = 1;
  string worker_id = 2;
  // How long the server may hold this call waiting for work, in
  // milliseconds. 0 returns immediately. Server caps at 30000.
  int64  wait_ms   = 3;
}

message LeaseTaskResponse {
  bool   found       = 1;
  string tenant      = 2;
  string project     = 3;
  string workflow_id = 4;
  string task_type   = 5;
  bytes  input       = 6;
  // Attempt number of this lease, 1-based. Echo it back on heartbeat,
  // complete, and fail calls - it is the fencing token.
  int32  attempt     = 7;
  int64  lease_deadline_unix_nano = 8;
}

message HeartbeatTaskRequest {
  string tenant      = 1;
  string project     = 2;
  string workflow_id = 3;
  string worker_id   = 4;
  int32  attempt     = 5;
}

message HeartbeatTaskResponse {
  bool  valid = 1;
  int64 lease_deadline_unix_nano = 2;
}

message CompleteTaskRequest {
  string tenant      = 1;
  string project     = 2;
  string workflow_id = 3;
  string worker_id   = 4;
  int32  attempt     = 5;
  bytes  result      = 6;
}

message CompleteTaskResponse {
  bool accepted  = 1;
  // duplicate is true when the execution had already completed - the caller
  // can treat its work as done.
  bool duplicate = 2;
}

message FailTaskRequest {
  string tenant      = 1;
  string project     = 2;
  string workflow_id = 3;
  string worker_id   = 4;
  int32  attempt     = 5;
  string error       = 6;
  // retryable = false forces the execution dead regardless of remaining
  // attempts.
  bool   retryable   = 7;
}

message FailTaskResponse {
  bool accepted   = 1;
  bool will_retry = 2;
}

message GetExecutionRequest {
  string tenant      = 1;
  string project     = 2;
  string workflow_id = 3;
}

message ExecutionStateMsg {
  bool   found       = 1;
  string tenant      = 2;
  string project     = 3;
  string workflow_id = 4;
  string task_type   = 5;
  string status      = 6; // pending | running | retrying | completed | failed
  int32  attempt     = 7;
  int32  max_attempts = 8;
  string worker_id   = 9;
  bytes  result      = 10;
  string error       = 11;
  int64  submitted_unix_nano = 12;
  int64  updated_unix_nano   = 13;
  int64  lease_deadline_unix_nano = 14;
}

// TransitionMsg is one step in an execution's rebuilt history.
message TransitionMsg {
  string event_type = 1; // wf.submitted | wf.leased | wf.heartbeat | ...
  string status     = 2; // status after applying the event
  int32  attempt    = 3;
  string worker_id  = 4;
  string detail     = 5;
  int64  at_unix_nano = 6;
}

message ExecutionHistoryResponse {
  bool found = 1;
  repeated TransitionMsg transitions = 2;
}

message ListExecutionsRequest {
  // Optional status filter: pending | running | retrying | completed | failed.
  string status = 1;
  // Maximum summaries to return. Server caps at 1000; counts are always
  // over the full store.
  int32  limit  = 2;
}

message ExecutionSummaryMsg {
  string tenant      = 1;
  string project     = 2;
  string workflow_id = 3;
  string task_type   = 4;
  string status      = 5;
  int32  attempt     = 6;
  int64  updated_unix_nano = 7;
}

message ListExecutionsResponse {
  repeated ExecutionSummaryMsg executions = 1;
  // Counts by status over every tracked execution.
  map<string, int64> counts = 2;
}
